<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>img gallery with grid</title>

    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      .gallery {
        background-color: black;
        margin: 0.5em;
      }

      .gallery__title {
        color: white;
        padding: 0.5em;
        font-size: 2em;
      }

      .gallery__items {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }

      .item {
        display: grid;
        border-left: 1px solid black;
        border-bottom: 1px solid black;
        grid-template-rows: 1fr auto;
      }

      .item__img {
        width: 100%;
        object-fit: cover;
        height: 100%;
      }

      .item__info {
        background-color: white;
        display: grid;
        grid-template-columns: 1fr auto;
        align-self:;
      }

      .item__price {
        background-color: black;
        color: white;
        font-weight: bold;
        padding: 0.5em;
      }
      .item__btn {
        text-decoration: none;
        background-color: rgb(18, 167, 50);
        color: white;
        padding: 0.5em;
        transition: background-color 0.3s ease-in-out;
      }

      .item__btn:hover {
        background-color: rgb(122, 184, 0);
      }

      .item__tags {
        grid-column: 1 / span 2;
        display: flex;
        flex-wrap: wrap;
        padding: 0.2em;
        gap: 0.2em;
      }

      .item__tag {
        background-color: rgb(230, 228, 228);
        padding: 0.2em;
        border-radius: 10px;
      }

      @media (max-width: 768px) {
      }
    </style>
  </head>
  <body>
    <section class="gallery">
      <h2 class="gallery__title">gallery</h2>
      <section class="gallery__items">
        <article class="item">
          <img
            src="./assets/images/coffee-shop.jpg"
            alt="coffee coffee-shop"
            class="item__img"
          />
          <div class="item__info">
            <div class="item__price">$50</div>
            <a href="#" class="item__btn">Buy Now</a>
            <div class="item__tags">
              <span class="item__tag">Lorem.</span
              ><span class="item__tag">Neque.</span
              ><span class="item__tag">Ab.</span>
            </div>
          </div>
        </article>

        <article class="item">
          <img
            src="./assets/images/costal-landscape.jpg"
            alt="coffee coffee-shop"
            class="item__img"
          />
          <div class="item__info">
            <div class="item__price">$50</div>
            <a href="#" class="item__btn">Buy Now</a>
            <div class="item__tags">
              <span class="item__tag">Lorem.</span
              ><span class="item__tag">Neque.</span
              ><span class="item__tag">Ab.</span
              ><span class="item__tag">Sequi.</span
              ><span class="item__tag">Quaerat.</span
              ><span class="item__tag">Facere?</span
              ><span class="item__tag">Nulla.</span
              ><span class="item__tag">Voluptates.</span>
            </div>
          </div>
        </article>

        <article class="item">
          <img
            src="./assets/images/ring-of-fire.jpg"
            alt="coffee coffee-shop"
            class="item__img"
          />
          <div class="item__info">
            <div class="item__price">$50</div>
            <a href="#" class="item__btn">Buy Now</a>
            <div class="item__tags">
              <span class="item__tag">Lorem.</span
              ><span class="item__tag">Neque.</span
              ><span class="item__tag">Ab.</span
              ><span class="item__tag">Sequi.</span
              ><span class="item__tag">Quaerat.</span
              ><span class="item__tag">Facere?</span
              ><span class="item__tag">Nulla.</span
              ><span class="item__tag">Voluptates.</span>
            </div>
          </div>
        </article>
      </section>
    </section>
  </body>
</html>
