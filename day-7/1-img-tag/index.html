<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Img Tag</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      h2 {
        text-align: center;
      }

      .item {
        padding: 0.1em;
        border: 2px solid;
        flex-shrink: 1;
        flex-grow: 1;
        flex-basis: 25vw;
        display: flex;
        flex-direction: column;
      }

      .item__img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
        flex-grow: 1;
      }

      .gallery {
        padding: 0.1em;
        display: flex;
        flex-wrap: wrap;
        /* align-items: center; */
        gap: 10px;
      }

      .item__details {
        background-color: #333;
        display: flex;
        justify-content: space-between;
      }

      .item__title {
        padding: 0.3em;
        color: white;
        flex-grow: 1;
        text-transform: capitalize;
      }

      .item__price {
        padding: 0.3rem;
        background-color: #555;
        color: white;
        flex-shrink: 0;
        align-content: center;
      }

      .item__buy-btn {
        padding: 0.3em;
        text-decoration: none;
        flex-shrink: 0;
        align-content: center;
        color: white;
        background-color: rgb(90, 131, 90);
      }

      .item__buy-btn:hover {
        background-color: rgb(0, 96, 0);
      }

      @media (max-width: 576px) {
        .gallery{
          flex-direction: column;
        }
        
      }
    </style>
  </head>
  <body>
    <h2>Images Gallery using flex-box</h2>

    <section class="gallery">
      <article class="item">
        <img
          src="./assets/images/coffee-shop.jpg"
          alt="Coffee Shop"
          class="item__img"
        />
        <div class="item__details">
          <p class="item__title">coffee shop Lorem ipsum dolor sit, amet consectetur adipisicing elit. Atque, assumenda?</p>
          <p class="item__price">$ 10.5</p>
          <a href="#" class="item__buy-btn">Buy Now</a>
        </div>
      </article>
      <article class="item">
        <img
          src="./assets/images/costal-landscape.jpg"
          alt="Costal Landscape"
          class="item__img"
        />
        <div class="item__details">
          <p class="item__title">Office</p>
          <p class="item__price">$ 10.5</p>
          <a href="#" class="item__buy-btn">Buy Now</a>
        </div>
      </article>
      <article class="item">
        <img
          src="./assets/images/remote-work.jpg"
          alt="Remote Work"
          class="item__img"
        />
        <div class="item__details">
          <p class="item__title">Remote Work</p>
          <p class="item__price">$ 10.5</p>
          <a href="#" class="item__buy-btn">Buy Now</a>
        </div>
      </article>
      <article class="item">
        <img
          src="./assets/images/ring-of-fire.jpg"
          alt="Ring Of Fire"
          class="item__img"
        />
        <div class="item__details">
          <p class="item__title">Ring of Fire</p>
          <p class="item__price">$ 10.5</p>
          <a href="#" class="item__buy-btn">Buy Now</a>
        </div>
      </article>
      <article class="item">
        <img
          src="./assets/images/domestic-life.jpg"
          alt="Domestic Life"
          class="item__img"
        />
        <div class="item__details">
          <p class="item__title">Domestic Life</p>
          <p class="item__price">$ 10.5</p>
          <a href="#" class="item__buy-btn">Buy Now</a>
        </div>
      </article>
    </section>
  </body>
</html>
