<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>background-image with headers</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      .card-container {
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        padding: 0.5em;
      }

      .card {
        background-image: url(./assets/images/coffee-shop.jpg);
        background-size: cover;
        background-position: center;
        aspect-ratio: 1/1;
        display: flex;
      }
      .card__text {
        padding: 0.5em;
        background: linear-gradient(transparent, rgb(173, 172, 172));
        flex-grow: 1;
        align-self: flex-start;
      }

      .card__text--bottom {
        align-self: flex-end;
      }

      @media (min-width: 576px) {
        .card-container {
          flex-direction: row;
        }

        .card {
          flex-basis: 400px;
          flex-grow: 1;
        }
      }
    </style>
  </head>
  <body>
    <section class="card-container">
      <article class="card">
        <div class="card__text">
          <h3 class="card__sub-header">Lorem, ipsum dolor.</h3>
          <h2 class="card__header">Lorem ipsum dolor sit amet.</h2>
        </div>
      </article>
      <article class="card">
        <div class="card__text card__text--bottom">
          <h3 class="card__sub-header">Lorem, ipsum dolor.</h3>
          <h2 class="card__header">Lorem ipsum dolor sit amet.</h2>
        </div>
      </article>
    </section>
  </body>
</html>
