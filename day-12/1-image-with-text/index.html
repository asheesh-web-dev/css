<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>image with text</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      .card {
        width: 350px;
        margin: auto;
      }

      .card_img-wrapper{
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
      }
      .card__img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card__header{
        background-color: black;
        color: white;
        text-align: center;

      }

      .card__sub-header{
        background-color: black;
        color: white;
        text-align: center;

      }
    </style>
  </head>
  <body>
    <article class="card">
      <h2 class="card__header">Lorem, ipsum dolor.</h2>
      <div class="card_img-wrapper">
        <img
          src="./assets/images/coffee-shop.jpg"
          alt="Coffe Shop"
          class="card__img"
        />
      </div>

      <h3 class="card__sub-header">Lorem ipsum dolor sit.</h3>
    </article>
  </body>
</html>
