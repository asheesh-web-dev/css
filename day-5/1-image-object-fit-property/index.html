<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Img object-fit property</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .album {
        background-color: rgb(234, 233, 233);
        display: flex;
        gap: 2px;
        width: 75vw;
        justify-content: center;
        flex-wrap: wrap;
        margin: auto;
      }

      .item{
        border: 3px solid rgb(19, 107, 77);
      }

      .item__img {
        border: 3px solid rgb(181, 125, 66);
        width: 100%;
        height: 400px;
        object-fit: cover;
        max-width: 400px;
      }

      .item__title {
        text-align: center;
      }

      .item__img-1 {
        object-fit: contain;
      }

      .item__img-2 {
        object-fit: cover;
      }

      .item__img-3 {
        object-fit: fill;
      }

      .item__img-4 {
        object-fit: scale-down;
      }

      @media (max-width: 919px) {
        .album {
          flex-direction: column;
        }

        .item__img {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="album">
      <article class="item album__item">
        <img
          src="./assets/images/coffee-shop.jpg"
          alt="coffee-shop"
          class="item__img item__img-1"
        />

        <h2 class="item__title">contain</h2>
      </article>
      <article class="item album__item">
        <img
          src="./assets/images/coffee-shop.jpg"
          alt="coffee-shop"
          alt="coffee-shop"
          class="item__img item__img-2"
        />

        <h2 class="item__title">cover</h2>
      </article>
      <article class="item album__item">
        <img
          src="./assets/images/coffee-shop.jpg"
          alt="coffee-shop"
          alt="coffee-shop"
          class="item__img item__img-3"
        />

        <h2 class="item__title">fill</h2>
      </article>
      <article class="item album__item">
        <img
          src="./assets/images/coffee-shop.jpg"
          alt="coffee-shop"
          class="item__img item__img-4"
        />

        <h2 class="item__title">scale-down</h2>
      </article>

      <article class="item album__item">
        <img
          src="./assets/images/costal-landscape.jpg"
          alt="coffee-shop"
          class="item__img item__img-5"
        />

        <h2 class="item__title">cover</h2>
      </article>

      <article class="item album__item">
        <img
          src="./assets/images/remote-work.jpg"
          alt="coffee-shop"
          class="item__img item__img-6"
        />

        <h2 class="item__title">cover</h2>
      </article>
    </section>
  </body>
</html>
