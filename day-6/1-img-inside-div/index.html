<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>img tag</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }

      .img-container {
        width: 600px;
        border: 3px solid dodgerblue;
        margin: auto;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="img-container">
      <img src="./assets/images/coffee-shop.jpg" alt="Coffe Shop" />
    </div>
  </body>
</html>
